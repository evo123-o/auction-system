spring.application.name=AuctionSystem

# Server Configuration
server.port=8080

# DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/auction_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# MyBatis Plus Configuration
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml

# LocalUpdate
app.upload.dir=uploads
app.upload.base-url=/uploads

# Custom Application Configuration
app.auction.default-extend-minutes=5
app.auction.max-extend-count=3

# Image-related settings
# Compression is triggered when the image size exceeds image.max-size-bytes (in bytes), default is 2MB
image.max-size-bytes=2097152
image.max-width=1024
image.max-height=1024

# Rough maximum file protection on the Controller side (directly reject if too large)
image.max-size-bytes-controller=2097152

logging.level.org.springframework.security=DEBUG




